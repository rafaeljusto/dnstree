<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="Resolve a name from the root servers down, and draw the path it took.">
<title>dnstree</title>
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    color-scheme: dark;
    --bg: oklch(0.13 0.03 255);
    --ink: oklch(0.93 0.02 230);
    --dim: oklch(0.68 0.03 240);
    --line: oklch(0.8 0.08 220 / 0.18);
    --glass: oklch(0.2 0.04 250 / 0.55);
    --accent: oklch(0.8 0.14 220);
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    display: grid; place-items: center; min-height: 100vh; padding: 16px;
    background: radial-gradient(120% 90% at 50% 20%, oklch(0.19 0.05 255), var(--bg) 70%);
    color: var(--ink); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 3px; }
  main { width: min(560px, 100%); }
  h1 { font: 600 28px var(--mono); margin: 0 0 4px; letter-spacing: -0.01em; }
  h1 .caret { color: var(--accent); margin-right: 4px; }
  h1 .dim, .dim { color: var(--dim); }
  p.lede { margin: 0 0 24px; color: var(--dim); }
  form { display: grid; gap: 12px; padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--glass); }
  .ask { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  input[type=text], select, button {
    font: 15px var(--mono); color: var(--ink); background: oklch(0.16 0.035 252);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 0;
  }
  input[type=text]:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .how { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; }
  .how fieldset { border: 0; padding: 0; margin: 0; display: flex; gap: 16px; }
  .how legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .how label { display: inline-flex; gap: 6px; align-items: center; color: var(--dim); cursor: pointer; }
  button { background: var(--accent); color: var(--bg); font-weight: 600; border: 0; cursor: pointer; padding: 10px 18px; }
  button:disabled { opacity: 0.6; cursor: progress; }
  .walking { font: 13px var(--mono); color: var(--accent); min-height: 1.5em; margin: 12px 0 0; }
  footer { margin-top: 28px; font-size: 13px; color: var(--dim); }
  footer code { font-family: var(--mono); }
</style>
</head>
<body>
<main>
  <h1><span class="caret">&#9656;</span>dnstree<span class="dim">//web</span></h1>
  <p class="lede">resolve a name from the root servers down, one hop at a time, and see the path it took.</p>

  <form action="walk" method="get" id="ask">
    <div class="ask">
      <input type="text" name="name" id="name" placeholder="www.example.com" required maxlength="253"
        autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="the name to walk to" autofocus>
      <select name="type" id="type" aria-label="the type to ask for">
        {{range .}}<option>{{.}}</option>{{end}}
      </select>
    </div>
    <div class="how">
      <fieldset>
        <legend>how to draw it</legend>
        <label><input type="radio" name="view" value="3d" checked> in 3d</label>
        <label><input type="radio" name="view" value="tree"> as a tree</label>
      </fieldset>
      <button type="submit" id="go">walk</button>
    </div>
  </form>
  <p class="walking" id="walking" aria-live="polite"></p>

  <footer>
    every walk starts at the root and checks the chain of trust on the way down.
    the same thing runs in a terminal: <code>dnstree --format web-3d --dnssec</code>
    &#183; <a href="https://github.com/rafaeljusto/dnstree">github.com/rafaeljusto/dnstree</a>
  </footer>
</main>
<script>
  // The next page waits for the walk, so this one says what is happening meanwhile.
  document.getElementById("ask").addEventListener("submit", () => {
    document.getElementById("go").disabled = true;
    document.getElementById("walking").textContent = "walking from the root…";
  });
  // Coming back to the form from a walk finds it ready again.
  addEventListener("pageshow", () => {
    document.getElementById("go").disabled = false;
    document.getElementById("walking").textContent = "";
  });
</script>
</body>
</html>

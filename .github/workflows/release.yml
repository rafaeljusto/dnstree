name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump: auto derives it from the commits since the last tag"
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major
      dry_run:
        description: "Report the version that would be released, without tagging or releasing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # version resolves the tag the release job publishes, from either entry point:
  # a tag pushed by hand, or a dispatch that reads the commits since the last
  # tag and creates the tag itself. The dispatch path cannot hand off to the
  # push path — a tag created with GITHUB_TOKEN does not trigger
  # `on: push: tags` — so the job below runs off these outputs, not off the ref.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version || steps.compute.outputs.version }}
      previous_tag: ${{ steps.tag.outputs.previous_tag || steps.compute.outputs.previous_tag }}
      sha: ${{ github.sha }}
      release: ${{ steps.tag.outputs.release || steps.compute.outputs.release }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Guard the release ref
        if: github.event_name == 'workflow_dispatch'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]; then
            echo "::error::Releases are cut from ${DEFAULT_BRANCH}; this run is on ${GITHUB_REF_NAME}."
            exit 1
          fi

      - name: Version from tag
        id: tag
        if: github.event_name == 'push'
        run: |
          set -euo pipefail

          version="${GITHUB_REF#refs/tags/}"
          previous="$(git tag --list 'v*' --sort=-version:refname | grep -A1 "^${version}$" | tail -n1 || echo "")"
          if [ "$previous" = "$version" ]; then
            previous=""
          fi

          {
            echo "version=$version"
            echo "previous_tag=$previous"
            echo "release=true"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Compute version
        id: compute
        if: github.event_name == 'workflow_dispatch'
        env:
          BUMP: ${{ inputs.bump }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          # Appends version, previous_tag, bump and unclassified to
          # $GITHUB_OUTPUT, and a table of the changes to the run summary. A
          # commit whose subject carries no known prefix counts as a patch and
          # is flagged there, so an under-versioned release is visible.
          # changelog.md holds the same changes grouped by kind, for the tag.
          go run ./cmd/next-version -bump="$BUMP" -changelog=changelog.md

          if [ "$DRY_RUN" = "true" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        if: github.event_name == 'workflow_dispatch' && steps.compute.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.compute.outputs.version }}
        run: |
          set -euo pipefail

          # Annotated, so the tag records who cut the release and when, and
          # carries the changelog: `git show ${VERSION}` then says what shipped
          # without a network. The subject is the version, as git expects.
          message="$(printf '%s\n\n%s' "${VERSION}" "$(cat changelog.md)")"

          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f tag="${VERSION}" \
            -f message="${message}" \
            -f object="${GITHUB_SHA}" \
            -f type=commit \
            --jq '.sha')"

          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${VERSION}" \
            -f sha="${tag_sha}"

          echo "::notice::Tagged ${VERSION} at ${GITHUB_SHA}"

  # In parallel with the archives: the image carries the same binary, built
  # the same way, from the same commit.
  image:
    runs-on: ubuntu-latest
    needs: version
    if: needs.version.outputs.release == 'true'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.version.outputs.sha }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: make image-push VERSION=${{ needs.version.outputs.version }}

  release:
    runs-on: ubuntu-latest
    needs: version
    if: needs.version.outputs.release == 'true'

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ needs.version.outputs.sha }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go test ./...

      # The same target that builds a release locally, so what ships can be
      # reproduced without a runner: the archives, the Debian, RPM and Alpine
      # packages, the Homebrew formula and the checksums over all of them.
      - run: make dist VERSION=${{ needs.version.outputs.version }}

      # Both entry points land here, so the notes are written from the commits
      # rather than from GitHub's generated list, which only sees what came
      # through a pull request.
      - name: Write the release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PREVIOUS: ${{ needs.version.outputs.previous_tag }}
        run: |
          set -euo pipefail

          # -from is passed even when it is empty: the tag being released
          # already exists by now, and left to look for the previous one the
          # tool would find that tag and report nothing to release.
          go run ./cmd/next-version -from="$PREVIOUS" -changelog=notes.md -output= -summary=

          # A release carries packages for four ecosystems now, and an .apk
          # sitting in an asset list says nothing about how to install it.
          base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$VERSION"
          printf '\n' >> notes.md
          sed -e "s|@BASE@|$base|g" \
              -e "s|@VERSION@|$VERSION|g" \
              -e "s|@BARE@|${VERSION#v}|g" packaging/install.md >> notes.md

          if [ -n "$PREVIOUS" ]; then
            printf '\n**Full changelog**: %s/%s/compare/%s...%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$PREVIOUS" "$VERSION" >> notes.md
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail

          gh release create "$VERSION" \
            --fail-on-no-commits \
            --title "$VERSION" \
            --notes-file notes.md \
            --verify-tag \
            dist/*

name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The embedded hints and anchors go stale silently; the live test is the
    # only thing that notices.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test -race ./...

  # Its own job, so that the linter's cache is not shared with the build's.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # golangci-lint does not replace this: its bundled govet ships a
      # different set of analysers, and misses appends and slog among others.
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

  # Apart from lint, because this one goes red when somebody else publishes a
  # CVE rather than when this code changes. On the schedule too, so that a
  # quiet week is not a blind one.
  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  live:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -tags live -count=1 ./...

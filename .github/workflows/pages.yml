# Publishes docs/index.html to GitHub Pages. The page is committed and
# self-contained, so this workflow only serves what is already in the tree,
# with the latest release written into its package lines. The release workflow
# dispatches it, so those lines move with every release. Every action here is
# GitHub-owned.
name: pages

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - '!docs/guide/**'
      - '!docs/README.md'
      - .github/workflows/pages.yml
  workflow_dispatch:

# GITHUB_TOKEN needs pages:write to deploy, and id-token:write for the
# deployment to prove it came from this workflow.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once, and let an in-flight one finish rather
# than cancelling it half published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      # Only the lines that name a release are touched; their templates carry
      # {v} and no version of their own.
      - name: Name the latest release
        run: |
          set -euo pipefail
          tag="$(git tag --list 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          [ -n "$tag" ] || exit 0
          sed -i -E "/<code>.*releases\/download\/v[0-9]/s/[0-9]+\.[0-9]+\.[0-9]+/${tag#v}/g" docs/index.html

      # The guide is read on GitHub and in the packages, not on the site.
      - name: Leave out the guide
        run: rm -rf docs/guide docs/README.md

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v5

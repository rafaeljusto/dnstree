# Publishes docs/index.html to GitHub Pages. The page is committed and
# self-contained, so this workflow only has to serve what is already in the
# tree. Every action here is GitHub-owned.
name: pages

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

# GITHUB_TOKEN needs pages:write to deploy, and id-token:write for the
# deployment to prove it came from this workflow.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once, and let an in-flight one finish rather
# than cancelling it half published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v5
